<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSAL Q Program - Gemini V2 Authority</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px;
        }

        .poster-container {
            width: 1080px;
            height: 1350px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            border-top: 20px solid #D97706;
            /* Brand Amber */
        }

        .content-layer {
            padding: 80px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .eyebrow {
            font-family: 'Noto Serif KR', serif;
            color: #10B981;
            /* Brand Green */
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Noto Serif KR', serif;
            font-size: 76px;
            line-height: 1.2;
            color: #1e293b;
            font-weight: 900;
            margin-bottom: 25px;
        }

        /* Profile Card */
        .profile-section {
            display: flex;
            background: #F8F9FA;
            /* Brand Light Gray */
            padding: 60px;
            border-radius: 20px;
            gap: 40px;
            margin: 40px 0;
            border: 1px solid #e5e7eb;
        }

        .profile-pic-placeholder {
            width: 200px;
            height: 200px;
            background: #D97706;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            font-weight: 900;
        }

        .profile-content h2 {
            font-size: 36px;
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        .profile-list li {
            font-size: 22px;
            margin-bottom: 12px;
            color: #4b5563;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: auto;
        }

        .stat-item {
            text-align: center;
        }

        .stat-num {
            font-size: 48px;
            font-weight: 900;
            color: #D97706;
        }

        .stat-text {
            font-size: 18px;
            color: #64748b;
            font-weight: 600;
        }

        .apply-btn {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 60px;
            border-radius: 8px;
        }

        .gemini-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 10px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>
    <div class="poster-container">
        <div class="content-layer">
            <div class="eyebrow">SSAL Works Exclusive</div>
            <h1>"회계사가 코딩을?<br>그것도 20년차가?"</h1>
            <p style="font-size: 28px; color: #4b5563; line-height: 1.6;">
                네, 가능합니다. 20년차 회계사가 직접 증명했습니다.<br>
                <strong>Sunny와 함께라면 당신도 할 수 있습니다.</strong>
            </p>

            <div class="profile-section">
                <div class="profile-pic-placeholder">Sunny</div>
                <div class="profile-content">
                    <h2>Mentor Profile</h2>
                    <ul style="list-style: none;">
                        <li>✔ 공인회계사(CPA) 경력 20년</li>
                        <li>✔ 정부지원사업 심사위원 5년</li>
                        <li>✔ 엑셀러레이터 경력 10년</li>
                        <li>✔ SSAL Works 플랫폼 직접 개발</li>
                    </ul>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-num">3개월</div>
                    <div class="stat-text">완성 과정</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num">1:1</div>
                    <div class="stat-text">밀착 코칭</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num">300</div>
                    <div class="stat-text">만원 (초기비용)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num">∞</div>
                    <div class="stat-text">평생 기술</div>
                </div>
            </div>

            <a href="#" class="apply-btn">전문가 과정 신청하기 →</a>
        </div>
        <div class="gemini-badge">Designed by Gemini</div>
    </div>
</body>

</html>
