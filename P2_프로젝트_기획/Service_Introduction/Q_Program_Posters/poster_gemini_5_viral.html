<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSAL Q Program - Gemini V5 Viral</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #111;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px;
        }

        .poster-container {
            width: 1080px;
            height: 1350px;
            background: #D97706;
            /* Brand Amber Background */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 100px 60px;
        }

        .text-wrap {
            background: white;
            padding: 40px;
            transform: rotate(-2deg);
            box-shadow: 20px 20px 0 rgba(0, 0, 0, 0.8);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 90px;
            line-height: 1.1;
            color: #000;
            font-weight: 900;
        }

        h1 span {
            background: #10B981;
            color: white;
            padding: 0 20px;
        }

        .emoji-reaction {
            font-size: 150px;
            position: absolute;
            top: 50px;
            right: 50px;
            transform: rotate(15deg);
        }

        .bottom-area {
            background: #000;
            color: white;
            padding: 60px;
            border-radius: 30px;
            text-align: center;
        }

        .bottom-title {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #D97706;
        }

        .bottom-desc {
            font-size: 24px;
            margin-bottom: 40px;
        }

        .cta-btn {
            display: inline-block;
            background: white;
            color: black;
            font-size: 32px;
            font-weight: 900;
            padding: 20px 60px;
            border-radius: 50px;
            text-decoration: none;
        }

        .gemini-badge {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div class="poster-container">
        <div class="emoji-reaction">🤔</div>

        <div class="text-wrap">
            <h1>
                "아직도<br>
                <span>개발자</span><br>
                찾고 계세요?"
            </h1>
        </div>

        <div class="text-wrap" style="transform: rotate(1deg); margin-left: 100px;">
            <h1>
                "그 돈이면<br>
                <span>직접 만드는 게</span><br>
                빠릅니다."
            </h1>
        </div>

        <div class="bottom-area">
            <div class="bottom-title">SSAL WORKS 빌더 프로그램</div>
            <p class="bottom-desc">
                코딩 몰라도 OK. 3개월이면 당신이 CTO입니다.<br>
                선착순 마감 임박!
            </p>
            <a href="#" class="cta-btn">👉 지금 바로 신청하기</a>
        </div>

        <div class="gemini-badge">Designed by Gemini</div>
    </div>
</body>

</html>
