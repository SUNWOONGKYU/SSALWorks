<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSAL Q Program - Gemini V4 Minimal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px;
        }

        .poster-container {
            width: 1080px;
            height: 1350px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .logo-area {
            position: absolute;
            top: 80px;
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
        }

        h1 {
            font-size: 90px;
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -3px;
            color: #1d1d1f;
            margin-bottom: 40px;
        }

        h1 span {
            color: #86868b;
        }

        .hero-image {
            width: 600px;
            height: 400px;
            background: linear-gradient(135deg, #f5f5f7 0%, #e2e2e5 100%);
            border-radius: 40px;
            margin: 0 auto 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.1);
        }

        /* Accents using Brand Colors */
        .brand-text {
            color: #D97706;
        }

        .success-text {
            color: #10B981;
        }

        .feature-list {
            display: flex;
            gap: 60px;
            justify-content: center;
            margin-bottom: 80px;
        }

        .feature-item {
            text-align: left;
            max-width: 250px;
        }

        .feature-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1d1d1f;
        }

        .feature-desc {
            font-size: 17px;
            color: #86868b;
            line-height: 1.5;
        }

        .cta-btn {
            background: #0071e3;
            /* Classic clean blue or could use Brand Green #10B981 */
            background: #10B981;
            color: white;
            padding: 18px 40px;
            border-radius: 100px;
            font-size: 21px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .cta-btn:hover {
            background: #059669;
        }

        .gemini-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 10px;
            color: #d2d2d7;
        }
    </style>
</head>

<body>
    <div class="poster-container">
        <div class="logo-area">SSAL Works.</div>

        <h1>
            당신의 사업.<br>
            <span>직접 코딩하다.</span>
        </h1>

        <div class="hero-image">
            💻
        </div>

        <div class="feature-list">
            <div class="feature-item">
                <div class="feature-title brand-text">Powerful.</div>
                <div class="feature-desc">AI 튜터와 함께라면 복잡한 코딩도 놀랍도록 단순해집니다.</div>
            </div>
            <div class="feature-item">
                <div class="feature-title success-text">Proven.</div>
                <div class="feature-desc">20년차 회계사 Sunny의 검증된 비즈니스 멘토링.</div>
            </div>
            <div class="feature-item">
                <div class="feature-title" style="color:#1d1d1f">Yours.</div>
                <div class="feature-desc">3개월 후, 당신은 온전한 플랫폼 소유자가 됩니다.</div>
            </div>
        </div>

        <a href="#" class="cta-btn">Q 프로그램 더 알아보기</a>
        <div class="gemini-badge">Designed by Gemini</div>
    </div>
</body>

</html>
