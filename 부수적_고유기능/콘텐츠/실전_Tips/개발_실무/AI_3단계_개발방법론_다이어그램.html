<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 시대의 3단계 개발 방법론</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
        }

        .title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .stage-box {
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 8px;
            position: relative;
        }

        .stage-1 {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            border: 2px solid #3b82f6;
        }

        .stage-2 {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid #f59e0b;
        }

        .stage-3 {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            border: 2px solid #10b981;
        }

        .stage-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .stage-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .icon-1 { background: #3b82f6; }
        .icon-2 { background: #f59e0b; }
        .icon-3 { background: #10b981; }

        .stage-name {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
        }

        .stage-name-en {
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            margin-left: 8px;
        }

        .stage-desc {
            font-size: 15px;
            color: #475569;
            line-height: 1.6;
            padding-left: 52px;
        }

        .stage-quote {
            font-size: 14px;
            color: #64748b;
            font-style: italic;
            padding-left: 52px;
            margin-top: 4px;
        }

        .arrow-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            position: relative;
        }

        .arrow {
            width: 3px;
            height: 24px;
            background: linear-gradient(180deg, #94a3b8 0%, #64748b 100%);
            border-radius: 2px;
        }

        .arrow-head {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #64748b;
        }

        .plus-label {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        .footer-text {
            font-size: 13px;
            color: #94a3b8;
        }

        .highlight {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">AI 시대의 3단계 개발 방법론</h1>

        <!-- Stage 1: 목업 -->
        <div class="stage-box stage-1">
            <div class="stage-header">
                <div class="stage-icon icon-1">📦</div>
                <span class="stage-name">목업<span class="stage-name-en">Mock-up</span></span>
            </div>
            <div class="stage-desc">기능 구현 + 구조 설계</div>
            <div class="stage-quote">"일단 돌아가게 만든다"</div>
        </div>

        <!-- Arrow 1 -->
        <div class="arrow-container">
            <div class="arrow"></div>
            <div class="arrow-head"></div>
            <div class="plus-label">+ 디자인 시스템</div>
        </div>

        <!-- Stage 2: 프로토타입 -->
        <div class="stage-box stage-2">
            <div class="stage-header">
                <div class="stage-icon icon-2">🎨</div>
                <span class="stage-name">프로토타입<span class="stage-name-en">Prototype</span></span>
            </div>
            <div class="stage-desc">목업 + 세련된 디자인</div>
            <div class="stage-quote">"보여줄 수 있게 만든다"</div>
        </div>

        <!-- Arrow 2 -->
        <div class="arrow-container">
            <div class="arrow"></div>
            <div class="arrow-head"></div>
            <div class="plus-label">+ 체계적 방법론</div>
        </div>

        <!-- Stage 3: 프로덕션 -->
        <div class="stage-box stage-3">
            <div class="stage-header">
                <div class="stage-icon icon-3">🚀</div>
                <span class="stage-name">프로덕션<span class="stage-name-en">Production</span></span>
            </div>
            <div class="stage-desc">프로토타입 + 유지보수성</div>
            <div class="stage-quote">"오래 쓸 수 있게 만든다"</div>
        </div>

        <div class="footer">
            <p class="footer-text">AI와 함께라면 <span class="highlight">목업 = 작동하는 제품</span></p>
        </div>
    </div>
</body>
</html>
