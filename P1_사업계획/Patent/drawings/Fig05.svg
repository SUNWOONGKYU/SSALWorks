<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
    <rect width="100%" height="100%" fill="white" />

    <defs>
        <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="black" />
        </marker>
    </defs>
    <text x="600" y="60" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="48" font-weight="bold">도 5: Scheduler/Leveler 처리</text>
    <text x="600.0" y="150" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="36" font-weight="bold">Scheduler/Leveler (70)</text>

    <!-- 위상정렬부 (71) -->
    <rect x="350.0" y="200" width="500" height="180" fill="white" stroke="black" stroke-width="3" rx="10" />
    <text x="600.0" y="265" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="36" font-weight="bold">위상정렬부</text>
    <text x="840.0" y="235" text-anchor="end" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="28" font-weight="bold">(71)</text>
    <text x="600.0" y="315" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="28" font-weight="normal">Topological Sort</text>
    <path d="M 600,380 L 600,460" stroke="black" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />

    <!-- 슬롯 할당부 (72) -->
    <rect x="350.0" y="460" width="500" height="180" fill="white" stroke="black" stroke-width="3" rx="10" />
    <text x="600.0" y="525" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="36" font-weight="bold">슬롯 할당부</text>
    <text x="840.0" y="495" text-anchor="end" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="28" font-weight="bold">(72)</text>
    <text x="600.0" y="575" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="28" font-weight="normal">자원 제약 고려</text>
    <path d="M 600,640 L 600,720" stroke="black" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />

    <!-- 비용함수 최적화부 (73) -->
    <rect x="350.0" y="720" width="500" height="180" fill="white" stroke="black" stroke-width="3" rx="10" />
    <text x="600.0" y="785" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="36" font-weight="bold">비용함수 최적화부</text>
    <text x="840.0" y="755" text-anchor="end" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="28" font-weight="bold">(73)</text>
    <text x="600.0" y="835" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="28" font-weight="normal">Min(J)</text>
    <path d="M 600,900 L 600,980" stroke="black" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />

    <!-- 레벨 재배치부 (74) -->
    <rect x="350.0" y="980" width="500" height="180" fill="white" stroke="black" stroke-width="3" rx="10" />
    <text x="600.0" y="1045" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="36" font-weight="bold">레벨 재배치부</text>
    <text x="840.0" y="1015" text-anchor="end" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="28" font-weight="bold">(74)</text>
    <text x="600.0" y="1095" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="28" font-weight="normal">Level Balancing</text>
</svg>