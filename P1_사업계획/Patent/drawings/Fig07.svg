<?xml version="1.0" encoding="UTF-8"?>
<!-- RECREATED: Spec-Compliant Figure 7 (ID Chain Structure) -->
<svg width="1000" height="800" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="white"/>
    
    <defs>
        <marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 L1.5,3 Z" fill="black"/>
        </marker>
    </defs>

    <!-- TITLE -->
    <text x="500" y="80" text-anchor="middle" font-family="Malgun Gothic, AppleGothic, Dotum, sans-serif" font-size="40" font-weight="bold">도 7: SAL ID 체인 데이터 구조 및 관리 모듈</text>

    <!-- 1. Chain List (71) -->
    <g transform="translate(100, 150)">
        <rect x="0" y="0" width="800" height="200" fill="white" stroke="black" stroke-width="3"/>
        <text x="400" y="40" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="28" font-weight="bold">SAL ID 체인 목록 (71)</text>

        <!-- Chain Item 1 -->
        <rect x="50" y="70" width="150" height="80" fill="white" stroke="black" stroke-width="2"/>
        <text x="125" y="115" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="20">S1A1</text>
        <text x="125" y="135" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14">(Previous)</text>

        <line x1="200" y1="110" x2="250" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Chain Item 2 -->
        <rect x="250" y="70" width="150" height="80" fill="white" stroke="black" stroke-width="2"/>
        <text x="325" y="115" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="20">S2A1</text>
        
        <line x1="400" y1="110" x2="450" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Chain Item 3 (Current) -->
        <rect x="450" y="70" width="150" height="80" fill="white" stroke="black" stroke-width="4"/> <!-- Thicker border for Last -->
        <text x="525" y="115" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="bold">S2B2</text>
        
        <!-- Label for Last Segment = Current ID (72) -->
        <line x1="525" y1="150" x2="525" y2="250" stroke="black" stroke-width="2" stroke-dasharray="4,4"/>
    </g>

    <!-- Current ID (72) Box -->
    <g transform="translate(385, 400)">
        <rect x="0" y="0" width="280" height="80" fill="white" stroke="black" stroke-width="3"/>
        <text x="140" y="50" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="bold">최신 SAL ID (72)</text>
    </g>

    <!-- Appender (73) -->
    <g transform="translate(100, 550)">
        <rect x="0" y="0" width="300" height="100" fill="white" stroke="black" stroke-width="3"/>
        <text x="150" y="45" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="bold">체인 덧붙이기</text>
        <text x="150" y="75" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="bold">(73)</text>
    </g>
    <!-- Arrow: Appender -> Chain List (Append Only) -->
    <path d="M 250,550 L 250,350" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="320" y="520" font-family="Malgun Gothic, sans-serif" font-size="16">Append-Only</text>

    <!-- Resolver (74) -->
    <g transform="translate(600, 550)">
        <rect x="0" y="0" width="300" height="100" fill="white" stroke="black" stroke-width="3"/>
        <text x="150" y="45" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="bold">리졸버</text>
        <text x="150" y="75" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="bold">(74)</text>
    </g>
    <!-- Arrow: Resolver -> Current ID (Lookup) -->
    <path d="M 600,550 L 525,480" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="520" font-family="Malgun Gothic, sans-serif" font-size="16">Lookup</text>

</svg>
